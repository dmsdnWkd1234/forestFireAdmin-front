name: CD

on:
    push:
        branches: [develop]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Deploy to EC2
              uses: appleboy/ssh-action@v0.1.10
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_KEY }}
                  script: |
                      cd my-react-app

                      git pull origin develop

                      echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" > .env
                      echo "VITE_BACK_URL=${{ secrets.VITE_BACK_URL }}" >> .env
                      echo "VITE_WEATHER_API_KEY=${{ secrets.VITE_WEATHER_API_KEY }}" >> .env
                      echo "VITE_PASSKEY=${{ secrets.VITE_PASSKEY }}" >> .env

                      sudo docker stop my-react-app || true
                      sudo docker rm my-react-app || true
                      sudo docker build -t my-react-app .
                      sudo docker run -d -p 3000:3000 --name my-react-app my-react-app
